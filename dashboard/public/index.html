<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Smart AC Dashboard</title>
<style>
  body { font-family: Calibri, Arial, sans-serif; margin: 24px; color: #000; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #000; padding: 6px 10px; text-align: left; }
  button { margin-right: 4px; padding: 3px 8px; cursor: pointer; }
  .on { font-weight: bold; text-decoration: underline; }
  .offline { background: #e6e6e6; }
</style>
</head>
<body>
<h1>Smart AC - Facility Manager Dashboard</h1>
<p id="summary">Loading...</p>
<table>
  <thead>
    <tr><th>Zone</th><th>Temp (C)</th><th>Humidity (%)</th><th>Occupied</th><th>AC state</th><th>Sensor status</th><th>Manual override</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<script>
async function load() {
  const zones = await (await fetch('/api/zones')).json();
  const now = Date.now();
  let occupied = 0, cooling = 0, offline = 0;
  const html = zones.map((z) => {
    const stale = !z.last_seen || now - new Date(z.last_seen).getTime() > 60000;
    if (stale) offline++;
    if (z.occupancy) occupied++;
    if (z.actuator === 'cool') cooling++;
    const btn = (m) => `<button class="${z.override === m ? 'on' : ''}" onclick="setOverride('${z.zone_id}','${m}')">${m}</button>`;
    return `<tr class="${stale ? 'offline' : ''}">
      <td>${z.zone_id}</td><td>${z.temperature ?? '-'}</td><td>${z.humidity ?? '-'}</td>
      <td>${z.occupancy ? 'Yes' : 'No'}</td><td>${z.actuator}</td>
      <td>${stale ? 'No recent data' : 'OK'}</td>
      <td>${btn('auto')}${btn('cool')}${btn('off')}</td></tr>`;
  }).join('');
  document.getElementById('rows').innerHTML = html;
  document.getElementById('summary').textContent =
    `Zones: ${zones.length} | Occupied: ${occupied} | Cooling: ${cooling} | Offline: ${offline}`;
}
async function setOverride(zone_id, mode) {
  await fetch('/api/override', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ zone_id, mode }) });
  load();
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
